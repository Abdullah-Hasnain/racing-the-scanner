# D2: a custom Aqua Tracee policy that watches the syscalls the hiding payloads
# use. Load alongside Tracee's default signatures and compare what each catches.
#
#   tracee --policy detection/tracee/memory-hiding.yaml --output json
#
# Add `--output option:parse-arguments` for readable prot flags; the aggregator
# reads both forms. Tuning the scope (which of these fire on benign JIT/GC) is
# still open.
apiVersion: tracee.aquasec.com/v1beta1
kind: Policy
metadata:
  name: rts-memory-hiding
spec:
  scope:
    - global
  rules:
    - event: mprotect       # V2 locking/unlocking, also JIT (benign) -> false alarms to study
    - event: security_file_mprotect  # same calls, but with prev_prot: the aggregator
                                     # separates PROT_NONE<->RW (hiding) from RW<->RX (JIT)
    - event: madvise        # V3 MADV_DONTNEED, also GC (benign)
    - event: userfaultfd    # V3 fault-driven refill (rare in benign apps)
    - event: memfd_secret   # V4 hard bypass (the RAM scanner cannot see this)
