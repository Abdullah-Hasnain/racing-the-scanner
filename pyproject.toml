[project]
name = "racing-the-scanner"
version = "0.1.0"
description = "Comparing scheduling frameworks against memory-hiding and mimicry-starvation attacks on Linux."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "results", "figures"]

[tool.ruff.lint]
# Keep this friendly for a fast-moving student team: real errors, not nitpicks.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by the formatter, not enforced hard

[tool.pytest.ini_options]
testpaths = ["sim/tests", "detection/tests", "analysis/tests"]
addopts = "-q"
